# Local hooks, using the tools pinned in requirements-dev.txt (no network at commit time).
#   .venv/bin/pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: .venv/bin/ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy (types)
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: no-bronze-edits
        name: bronze files are never modified
        entry: bash -c 'if git diff --cached --name-only --diff-filter=MDR | grep -q "^data/bronze/"; then echo "data/bronze is read-only"; exit 1; fi'
        language: system
        pass_filenames: false
