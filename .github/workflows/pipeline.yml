name: pipeline

# Every push and pull request: unit tests, two full builds from bronze with the validation gate
# (s12 exits non-zero on any ERROR check), golden histories and regression baselines against the
# built warehouse, and determinism: every declared output must be byte-identical across the two
# builds except those listed with a reason in config/pipeline.yaml (determinism).

on:
  push:
  pull_request:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned dependencies and the package
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Unit tests
        run: pytest -q tests

      - name: Build 1 and validation gate
        run: |
          dvc repro --force
          cp dvc.lock /tmp/dvc.lock.build1
          cp outputs/pipeline/s12_output_manifest.csv /tmp/manifest.build1.csv

      - name: Golden histories and regression baselines against the built warehouse
        run: pytest -q tests

      - name: Build 2 and determinism check (V5)
        run: |
          dvc repro --force
          python -m district_evolution.compare_builds /tmp/dvc.lock.build1 dvc.lock
          diff /tmp/manifest.build1.csv outputs/pipeline/s12_output_manifest.csv

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            outputs/pipeline/s12_validation_report.md
            outputs/pipeline/s12_checks.csv
            outputs/pipeline/s12_output_manifest.csv
            outputs/pipeline/s11_invariants.csv
            outputs/events/s08_splink_model.json
            outputs/audit/EXTERNAL_AUDIT_REPORT.md
