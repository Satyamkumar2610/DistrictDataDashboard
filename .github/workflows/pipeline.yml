name: pipeline

# Every push and pull request: unit tests, two full builds from bronze with the validation gate
# (s12 exits non-zero on any ERROR check), golden histories and regression baselines against the
# built warehouse, and determinism: every declared output must be byte-identical across the two
# builds except those listed with a reason in config/pipeline.yaml (determinism).

on:
  push:
  pull_request:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned dependencies, dev tools and the package
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Lint and types
        run: |
          ruff check district_evolution tests scripts examples
          mypy

      - name: Stage order is derived from dvc.yaml (the CLI and dvc repro agree)
        run: python -m district_evolution stages

      - name: Unit tests
        run: pytest -q tests

      - name: Build 1 and validation gate
        run: |
          dvc repro --force
          cp dvc.lock /tmp/dvc.lock.build1
          cp outputs/pipeline/s12_output_manifest.csv /tmp/manifest.build1.csv

      - name: Golden histories and regression baselines against the built warehouse, with coverage
        run: pytest -q tests --cov=district_evolution --cov-report=term --cov-report=xml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web app - typecheck, build, and browser tests against the built release
        working-directory: web
        env:
          PW_CHANNEL: chromium
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Platform container - build, run read-only on the release, browser tests against it
        run: |
          docker build -t district-evolution:ci .
          docker run -d --name platform --read-only --tmpfs /tmp -p 8766:8000 -v "$PWD/data/release:/release:ro" district-evolution:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8766/api/meta > /dev/null && break; sleep 2; done
          (cd web && PW_CHANNEL=chromium PW_BASE_URL=http://127.0.0.1:8766 npx playwright test)
          docker rm -f platform

      - name: Build 2 and determinism check (V5)
        run: |
          dvc repro --force
          python -m district_evolution.compare_builds /tmp/dvc.lock.build1 dvc.lock
          diff /tmp/manifest.build1.csv outputs/pipeline/s12_output_manifest.csv

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            outputs/pipeline/s12_validation_report.md
            outputs/pipeline/s12_checks.csv
            outputs/pipeline/s12_output_manifest.csv
            outputs/pipeline/s11_invariants.csv
            outputs/events/s08_splink_model.json
            outputs/audit/EXTERNAL_AUDIT_REPORT.md
