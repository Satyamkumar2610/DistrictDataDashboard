# Pipeline v3 as a dependency DAG. `dvc repro` reruns only stages whose code,
# config, reference data, or inputs changed; dvc.lock records the md5 of every
# dependency and output (provenance). Outputs are not cached (cache: false)
# until a DVC remote is chosen — see docs/architecture/REVAMP_PLAN_V3.md §6.
# Run with the project venv active: source .venv/bin/activate && dvc repro

stages:
  s01_bronze_to_silver:
    cmd: python -m district_evolution.stages.s01_bronze_to_silver
    deps:
      - district_evolution/stages/s01_bronze_to_silver.py
      - district_evolution/sources
      - district_evolution/core
      - district_evolution/contracts
      - config/pipeline.yaml
      - config/sources.yaml
      - data/reference/state_lineage.csv
      - data/bronze/stanford
      - data/bronze/soi
    outs:
      - data/silver/geometry/stanford_1951.geoparquet: {cache: false}
      - data/silver/geometry/stanford_1961.geoparquet: {cache: false}
      - data/silver/geometry/stanford_1971.geoparquet: {cache: false}
      - data/silver/geometry/stanford_1981.geoparquet: {cache: false}
      - data/silver/geometry/stanford_1991.geoparquet: {cache: false}
      - data/silver/geometry/stanford_2001.geoparquet: {cache: false}
      - data/silver/geometry/stanford_2011.geoparquet: {cache: false}
      - data/silver/geometry/stanford_2021.geoparquet: {cache: false}
      - data/silver/geometry/soi_2025.geoparquet: {cache: false}
      - outputs/pipeline/s01_silver_summary.csv: {cache: false}
      - outputs/pipeline/s01_excluded_non_administrative.csv: {cache: false}
      - outputs/pipeline/s01_overlap_repairs.csv: {cache: false}

  s02_topology_audit:
