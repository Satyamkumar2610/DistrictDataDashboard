# Pipeline v3 as a dependency DAG. `dvc repro` reruns only stages whose code,
# config, reference data, or inputs changed; dvc.lock records the md5 of every
# dependency and output (provenance). Outputs are not cached (cache: false)
# until a DVC remote is chosen — see docs/architecture/REVAMP_PLAN_V3.md §6.
# Run with the project venv active: source .venv/bin/activate && dvc repro

stages:
  s01_bronze_to_silver:
    cmd: python -m district_evolution.stages.s01_bronze_to_silver
    deps:
      - district_evolution/stages/s01_bronze_to_silver.py
      - district_evolution/core
      - district_evolution/contracts
      - config/pipeline.yaml
      - config/sources.yaml
      - data/reference/state_lineage.csv
      - data/bronze/stanford
      - data/bronze/soi
    outs:
      - data/silver/geometry: {cache: false}
      - outputs/pipeline/s01_silver_summary.csv: {cache: false}
      - outputs/pipeline/s01_excluded_non_administrative.csv: {cache: false}
      - outputs/pipeline/s01_overlap_repairs.csv: {cache: false}

  s02_topology_audit:
    cmd: python -m district_evolution.stages.s02_topology_audit
    deps:
      - district_evolution/stages/s02_topology_audit.py
      - district_evolution/core
      - config/pipeline.yaml
      - data/silver/geometry
    outs:
      - outputs/pipeline/s02_topology_audit.csv: {cache: false}

  s03_transition_matrix:
    cmd: python -m district_evolution.stages.s03_transition_matrix
    deps:
      - district_evolution/stages/s03_transition_matrix.py
      - district_evolution/core
      - district_evolution/contracts
      - config/pipeline.yaml
      - data/silver/geometry
      - outputs/pipeline/s02_topology_audit.csv
    outs:
      - data/gold/spatial/transition_flow.parquet: {cache: false}
      - data/gold/spatial/transition_residual.parquet: {cache: false}
      - outputs/pipeline/s03_transition_summary.csv: {cache: false}
      - outputs/pipeline/s03_transfer_and_displacement_parts.gpkg: {cache: false}

  s04_identity:
    cmd: python -m district_evolution.stages.s04_identity
    deps:
      - data/reference/vintage_depiction.csv
      - district_evolution/stages/s04_identity.py
      - district_evolution/core
      - district_evolution/contracts
      - config/pipeline.yaml
      - data/reference/name_aliases.csv
      - data/silver/geometry
      - data/gold/spatial/transition_flow.parquet
    outs:
      - data/gold/core/ck_registry.parquet: {cache: false}
      - data/gold/core/ck_observation.parquet: {cache: false}
      - data/gold/core/continuity_decision.parquet: {cache: false}
      - outputs/pipeline/s04_ck_registry.csv: {cache: false}
      - outputs/pipeline/s04_continuity_decisions.csv: {cache: false}

  s05_lineage:
    cmd: python -m district_evolution.stages.s05_lineage
    deps:
      - data/reference/vintage_depiction.csv
      - district_evolution/stages/s05_lineage.py
      - district_evolution/core
      - district_evolution/contracts
      - config/pipeline.yaml
      - data/gold/spatial/transition_flow.parquet
      - data/gold/core/ck_registry.parquet
      - data/gold/core/ck_observation.parquet
    outs:
      - data/gold/spatial/ck_flow.parquet: {cache: false}
      - data/gold/events/district_relationship.parquet: {cache: false}
      - data/gold/spatial/measured_area_transfer.parquet: {cache: false}
      - data/gold/spatial/boundary_displacement.parquet: {cache: false}
      - outputs/pipeline/s05_district_relationship.csv: {cache: false}
      - outputs/pipeline/s05_measured_area_transfer.csv: {cache: false}
      - outputs/pipeline/s05_district_ancestry.csv: {cache: false}

  s06_area_ledger:
    cmd: python -m district_evolution.stages.s06_area_ledger
    deps:
      - district_evolution/stages/s06_area_ledger.py
      - district_evolution/core
      - district_evolution/contracts
      - data/gold/spatial/ck_flow.parquet
      - data/gold/spatial/transition_residual.parquet
      - data/gold/core/ck_registry.parquet
      - data/gold/core/ck_observation.parquet
    outs:
      - data/products/district_area_ledger.parquet: {cache: false}
      - data/products/district_area_ledger.csv: {cache: false}

  s07_events_aggregate:
    cmd: python -m district_evolution.stages.s07_events_aggregate
    deps:
      - district_evolution/stages/s07_events_aggregate.py
      - district_evolution/core
      - district_evolution/contracts
      - data/bronze/events/district_evolution_master.csv
    outs:
      - data/gold/events/boundary_event.parquet: {cache: false}
      - data/gold/events/event_participant.parquet: {cache: false}
      - outputs/events/s07_boundary_event.csv: {cache: false}

  s08_event_linkage:
    cmd: python -m district_evolution.stages.s08_event_linkage
    deps:
      - district_evolution/stages/s08_event_linkage.py
      - district_evolution/core
      - district_evolution/contracts
      - config/pipeline.yaml
      - data/reference/state_lineage.csv
      - data/reference/name_aliases.csv
      - data/gold/events/event_participant.parquet
      - data/gold/core/ck_observation.parquet
    outs:
      - data/gold/events/participant_ck_candidate.parquet: {cache: false}
      - outputs/events/s08_splink_model.json: {cache: false}

  s09_event_reconciliation:
    cmd: python -m district_evolution.stages.s09_event_reconciliation
    deps:
      - data/reference/vintage_depiction.csv
      - district_evolution/stages/s09_event_reconciliation.py
      - district_evolution/core
      - district_evolution/contracts
      - config/pipeline.yaml
      - data/gold/events/boundary_event.parquet
      - data/gold/events/event_participant.parquet
      - data/gold/events/participant_ck_candidate.parquet
      - data/gold/events/district_relationship.parquet
      - data/gold/core/ck_registry.parquet
      - data/gold/core/ck_observation.parquet
      - data/gold/spatial/ck_flow.parquet
      - data/gold/spatial/transition_residual.parquet
    outs:
      - data/gold/events/event_linkage.parquet: {cache: false}
      - data/gold/events/event_accounting.parquet: {cache: false}
      - data/gold/events/event_flow.parquet: {cache: false}
      - data/gold/events/event_summary.parquet: {cache: false}
      - data/gold/events/lineage_corroboration.parquet: {cache: false}
      - outputs/events/s09_event_linkage.csv: {cache: false}
      - outputs/events/s09_event_accounting.csv: {cache: false}
      - outputs/events/s09_event_flows.csv: {cache: false}
      - outputs/events/s09_event_summary.csv: {cache: false}
      - outputs/events/s09_lineage_corroboration.csv: {cache: false}

  s10_census_products:
    cmd: python -m district_evolution.stages.s10_census_products
    deps:
      - data/reference/vintage_depiction.csv
      - district_evolution/stages/s10_census_products.py
      - district_evolution/core
      - district_evolution/contracts
      - data/gold/spatial/transition_flow.parquet
      - data/gold/core/ck_registry.parquet
      - data/gold/core/ck_observation.parquet
    outs:
      - data/products/district_area_admin.parquet: {cache: false}
      - data/products/district_area_admin.csv: {cache: false}
      - data/products/district_area_admin_wide.csv: {cache: false}
      - data/products/crosswalk_to_reference.parquet: {cache: false}
      - data/products/crosswalk_to_reference.csv: {cache: false}
      - data/products/district_reference_context.parquet: {cache: false}
      - data/products/district_reference_context.csv: {cache: false}
      - data/products/district_reference_context_wide.csv: {cache: false}

  s11_warehouse:
    cmd: python -m district_evolution.stages.s11_warehouse
    deps:
      - district_evolution/stages/s11_warehouse.py
      - district_evolution/core
      - config/pipeline.yaml
      - data/silver/geometry
      - data/gold/core
      - data/gold/spatial
      - data/gold/events
      - data/products
      - outputs/pipeline/s01_overlap_repairs.csv
    outs:
      - data/gold/district_evolution.duckdb: {cache: false}
      - outputs/pipeline/s11_invariants.csv: {cache: false}

  s12_validate:
    cmd: python -m district_evolution.stages.s12_validate
    deps:
      - data/bronze/events/district_evolution_master.csv
      - data/reference/vintage_depiction.csv
      - district_evolution/stages/s12_validate.py
      - district_evolution/contracts
      - district_evolution/core
      - data/gold/district_evolution.duckdb
      - outputs/pipeline/s02_topology_audit.csv
    outs:
      - outputs/pipeline/s12_checks.csv: {cache: false}
      - outputs/pipeline/s12_output_manifest.csv: {cache: false}
      - outputs/pipeline/s12_validation_report.md: {cache: false}
      - outputs/pipeline/s12_map_date_check.csv: {cache: false}
