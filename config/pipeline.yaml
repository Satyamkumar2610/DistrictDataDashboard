# Pipeline v4 configuration. Every threshold used by any stage lives here with
# its rationale; code reads it via lib.CFG. See docs/architecture/REVAMP_PLAN_V3.md.

pipeline_version: "4.0.0"

vintages:
  # (source, year) in chronological order. The last entry is the reference
  # geography that census products are expressed in.
  - [stanford, 1951]
  - [stanford, 1961]
  - [stanford, 1971]
  - [stanford, 1981]
  - [stanford, 1991]
  - [stanford, 2001]
  - [stanford, 2011]
  - [stanford, 2021]
  - [soi, 2025]
reference_year: 2025

overlay:
  # A parcel is SLIVER when smaller than max(abs, rel * smaller polygon area).
  # Floating-point / snapping noise along shared boundaries (unchanged from v2).
  sliver_abs_km2: 0.5
  sliver_rel_fraction: 0.0001
  # A non-core parcel whose mean width (2 * area / perimeter) is below this is
  # BOUNDARY_DISPLACEMENT: two independently digitized editions disagreeing on
  # where a line runs, not territory changing hands. 1 km ~ positional accuracy
  # of 1:1,000,000-scale source maps. Measured on the v2 data: same-edition
  # windows (1951-61, 1981-91) have real transfers >= 3 km wide; cross-edition
  # windows (2001-11, 2021-25) show jitter strips peaking at 0.1-0.6 km.
  displacement_width_km: 1.0
  # A parcel is CORE when it holds at least this share of the smaller of its
  # two polygons; core parcels are never classified as displacement.
  core_share: 0.5

closure:
  # Geodesic area of a whole polygon vs the sum over its overlay fragments
  # differs by floating-point summation noise: measured mean 0.31 km2, max
  # 1.13 km2, max 0.108% on 1951-1961. The tolerance absorbs exactly that.
  tol_km2: 2.0
  tol_pct: 0.15
  # Beyond tolerance but under this share of the polygon, a closure excess is
  # explained by local self-overlap in the other layer (bounded by V1) and is
  # a WARNING. Above it the overlay itself is broken: ERROR.
  error_pct: 1.0

topology:
  self_overlap_warn_fraction: 0.001
  self_overlap_error_fraction: 0.01
  # Share of a layer's outline (holes in the union of its districts) covered by
  # no district. Above this the layer has unassigned interior land (V2 WARNING).
  gap_warn_fraction: 0.01
  # s01 assigns a pairwise overlap to the smaller polygon. That is right for an
  # enclave (the smaller polygon lies mostly inside the larger one). A repair
  # where the smaller polygon is less than this share inside the larger one is
  # two neighbours overlapping, where "smaller wins" is arbitrary: V22 WARNING.
  enclave_min_contained_share: 0.5

identity:
  # Banded continuity rule (plan section 3.3). r = share of source i going to
  # j, h = share of target j coming from i; only mutual-best pairs qualify.
  strong: 0.90          # r >= strong: i is essentially intact in j (name change = rename)
  core: 0.50            # a continuation must be built mostly (h >= core) from its predecessor
  # A child lying wholly inside its parent (h >= strong) that keeps the parent's
  # name continues the parent if it holds at least this share of the parent.
  # Measured on the v2 data: every such child with 0.16 <= r < 0.30 is a known
  # administrative continuation of a multi-way carve-out (Darbhanga 1972,
  # Telangana 2016: Adilabad/Medak/Karimnagar/Khammam, Chhattisgarh 2012:
  # Durg/Raipur/Surguja); none was a reconstitution.
  name_retained: 0.15
  name_jw: 0.90         # similarity threshold for "names agree" (tie-break only)

lineage:
  # Minimum TRANSFER-class area for a cross-CK flow to count as a lineage edge
  # or a measured transfer. Displacement and sliver parcels never count.
  material_km2: 0.5
  # A LINEAGE EDGE (a claim of parentage) also needs this share of its source
  # OR of its target. Measured on v3.0.0: 31 edges carried < 1% of the new
  # district's area; the km2 floor alone let a narrow edit along a long
  # boundary become a "parent". Measured transfers between existing districts
  # are measurements, not claims, and keep only the km2 floor. Sub-threshold
  # flows stay in the ledger and in minor_material_flow; no km2 is dropped.
  material_share: 0.01

linkage:
  # splink event-name -> CK record linkage (s08) and resolution (s09).
  # Placed in the widest gap of the fitted probability distribution, not on a
  # mode. v3 used 0.50, but the commonest true pattern for historical events
  # (exact name + historically compatible state, e.g. Karimnagar filed under
  # Telangana, mapped under Andhra Pradesh in 2011) scores 0.49-0.51 depending
  # on training noise: in v4 development it moved 0.506 -> 0.494 and ~70
  # Telangana/Kerala/Jharkhand links flipped. Measured clusters (v4): 0.94,
  # 0.80, 0.53, 0.49, 0.46 | gap | 0.19, 0.06. A name-level match below the
  # gap is never accepted; above it, s09 still requires geometric support
  # (footprint for successors, territory given away for predecessors).
  min_match_probability: 0.30
  ambiguity_margin: 0.10
  u_sampling_max_pairs: 2000000
  seed: 20260923
  # Fixed m-probability for "state incompatible". EM estimates 0 (no training
  # match has an incompatible state), which would make a mis-filed state an
  # absolute veto. 0.01 = strong evidence against, but a name + footprint
  # match can still win.
  state_mismatch_m_floor: 0.01

map_dates:
  # A state-map is flagged as possibly depicting later boundaries than its
  # label when at least this many of its new districts, and at least this share
  # of those with a recorded creation year, appear before that year. Isolated
  # cases are more likely event-date noise than a mislabelled layer. Flagged
  # layers need a second source before a CONFIRMED row goes into
  # data/reference/vintage_depiction.csv.
  min_districts: 3
  min_share: 0.5

products:
  # district_reference_context.n_source_districts counts a year-Y district as
  # "drawn on" by a reference district when it supplies at least this share of
  # the reference district (was hard-coded in s10 before v4).
  min_source_share: 0.01

anomaly:
  # V24 area anomaly: a CK whose area at one vintage differs from its area at
  # BOTH neighbouring vintages by more than dip_rel, while the two neighbours
  # agree within neighbour_agree_rel, and no lineage edge touches it in either
  # window (measured transfers do not exempt it: a defective map creates
  # them). That is a dip-and-recover with no event behind it: a digitization
  # defect in that one map (v3: Kolkata 2021 drawn at
  # 98.6 km2 against 196 km2 in every other vintage), not territorial change.
  dip_rel: 0.25
  neighbour_agree_rel: 0.10
  # V26 near-continuation: a BREAK_NAME_DIFFERS decision whose geometry is
  # almost a continuation (r >= near_r and h >= near_h) is listed for alias
  # curation (v3: Reasi/Riasi r = 0.895, h = 0.984).
  near_r: 0.85
  near_h: 0.95
  # V25: names that mark a non-administrative feature. A CK must never carry
  # one; curate the feature into data/reference/non_administrative_features.csv.
  non_admin_name_regex: "^(disputed|undisputed|unclaimed|claimed|data not available|not available|area under)"

validation:
  # V12: tolerance on "declared transfer never exceeds predecessor area"
  # (relative, floating-point summation noise only).
  declared_rel_tol: 1.0e-7
  # V17: an overlap repair removing more than this share of a polygon is listed
  # for review.
  overlap_repair_review_share: 0.001

area_check:
  # pyproj geodesic area vs DuckDB ST_Area_Spheroid (independent GeographicLib
  # implementation). Same polygon, same ellipsoid: must agree far tighter.
  max_rel_diff_pct: 0.01
