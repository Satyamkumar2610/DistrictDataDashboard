# Pipeline v3 configuration. Every threshold used by any stage lives here with
# its rationale; code reads it via lib.CFG. See docs/architecture/REVAMP_PLAN_V3.md.

pipeline_version: "4.1.0"

vintages:
  # (source, year) in chronological order. The last entry is the reference
  # geography that census products are expressed in.
  - [stanford, 1951]
  - [stanford, 1961]
  - [stanford, 1971]
  - [stanford, 1981]
  - [stanford, 1991]
  - [stanford, 2001]
  - [stanford, 2011]
  - [stanford, 2021]
  - [soi, 2025]
reference_year: 2025

placeholders:
  # s01: features that are not districts get no identity. Sentinel names ("DATA NOT AVAILABLE",
  # blank) mark unnamed placeholders (the 80,520 km2 J&K polygon). A name starting "Disputed" marks
  # a strip whose ownership between districts of different states is unsettled: SOI 2025 carries
  # nine, 0.7-14.5 km2 each (e.g. "Disputed (Sahibganj, Maldah & Katihar)"), which minted CKs and
  # counted as active districts before 4.0.0. Both are excluded and logged
  # (outputs/pipeline/s01_excluded_non_administrative.csv); their land is left unassigned on that
  # map, never given to a neighbour.
  sentinel_name_pattern: '^(nan|none|data not available|not available|n/?a|unknown|no data|unnamed|-+)?$'
  disputed_name_pattern: '^\s*disputed\b'

overlay:
  # A parcel is SLIVER when smaller than max(abs, rel * smaller polygon area).
  # Floating-point / snapping noise along shared boundaries (unchanged from v2).
  sliver_abs_km2: 0.5
  sliver_rel_fraction: 0.0001
  # Overlay parts below this are floating-point dust, not territory: 3,153 of the 4.0.0
  # transition_flow rows carried < 1e-9 km2 (most ~1e-14 km2, i.e. 0.01 mm2), and whether GEOS
  # emits them differs between platforms (Linux wheel 51,765 rows vs macOS 51,767), which broke
  # the cross-platform row-count baseline. 1 m2 is six orders of magnitude below the sliver
  # threshold, so no CORE / TRANSFER / DISPLACEMENT area is affected; the dropped dust is
  # reported as unmapped (sum over the whole build < 0.01 km2).
  numerical_noise_km2: 1.0e-6
  # A non-core parcel whose mean width (2 * area / perimeter) is below this is
  # BOUNDARY_DISPLACEMENT: two independently digitized editions disagreeing on
  # where a line runs, not territory changing hands. 1 km ~ positional accuracy
  # of 1:1,000,000-scale source maps. Measured on the v2 data: same-edition
  # windows (1951-61, 1981-91) have real transfers >= 3 km wide; cross-edition
  # windows (2001-11, 2021-25) show jitter strips peaking at 0.1-0.6 km.
  displacement_width_km: 1.0
  # A parcel is CORE when it holds at least this share of the smaller of its
  # two polygons; core parcels are never classified as displacement.
  core_share: 0.5

closure:
  # Geodesic area of a whole polygon vs the sum over its overlay fragments
  # differs by floating-point summation noise: measured mean 0.31 km2, max
  # 1.13 km2, max 0.108% on 1951-1961. The tolerance absorbs exactly that.
  tol_km2: 2.0
  tol_pct: 0.15
  # Beyond tolerance but under this share of the polygon, a closure excess is
  # explained by local self-overlap in the other layer (bounded by V1) and is
  # a WARNING. Above it the overlay itself is broken: ERROR.
  error_pct: 1.0

topology:
  self_overlap_warn_fraction: 0.001
  self_overlap_error_fraction: 0.01
  gap_warn_fraction: 0.01

identity:
  # Banded continuity rule (plan section 3.3). r = share of source i going to
  # j, h = share of target j coming from i; only mutual-best pairs qualify.
  strong: 0.90          # r >= strong: i is essentially intact in j (name change = rename)
  core: 0.50            # a continuation must be built mostly (h >= core) from its predecessor
  # A child lying wholly inside its parent (h >= strong) that keeps the parent's
  # name continues the parent if it holds at least this share of the parent.
  # Measured on the v2 data: every such child with 0.16 <= r < 0.30 is a known
  # administrative continuation of a multi-way carve-out (Darbhanga 1972,
  # Telangana 2016: Adilabad/Medak/Karimnagar/Khammam, Chhattisgarh 2012:
  # Durg/Raipur/Surguja); none was a reconstitution.
  name_retained: 0.15
  name_jw: 0.90         # similarity threshold for "names agree" (tie-break only)
  # Rule 1b, growth (OD-02, docs/decisions/OD-02_growth_continuation.md): a district essentially
  # intact in its successor (r >= strong) that keeps its name continues even when the successor is
  # built mostly from other land (h < core), if no other district continues into it. Measured on
  # 4.0.0 before the rule: 10 such cases (Una 1991, Gandhinagar 2001, Hyderabad 2001, Kanpur Nagar
  # 2001, Chennai 2021, Mumbai 2021, Punch 2021, New Delhi 2021, Champhai 2025, Kolkata 2025), h from
  # 0.219 to 0.499. growth_min_h 0.15 mirrors name_retained: below it the successor is essentially a
  # different unit that happens to carry the name.
  growth_continues: true
  growth_min_h: 0.15

lineage:
  # Minimum TRANSFER-class area for a cross-CK flow to count as a lineage edge
  # or a measured transfer. Displacement and sliver parcels never count.
  material_km2: 0.5
  # RECONSTITUTED_FROM (OD-01): a new district first mapped at least one map after an absorbed
  # district closed is linked to it when at least this share of the new district is its land.
  # Measured: the two cases in the data (Fatehgarh Sahib 0.63, Barnala 0.96, both PEPSU 1951)
  # clear it; docs/decisions/OD-01_reclassification.md.
  reconstitution_share: 0.5
  # A measured transfer between two existing districts is REVERSED when, within
  # reversal_windows maps either side, material area flows back between the same two districts
  # amounting to at least reversal_share of it. Land that goes and comes back between map
  # editions is how two independently digitized editions disagree (Udaipur <-> Ajmer exchange
  # the same ~1,354 km2 on four map pairs with no event), not a sequence of administrative
  # changes. The flag never removes a transfer (every km2 keeps its one classification); it lets
  # a user filter, and the events decide what remains administrative.
  reversal_share: 0.8
  reversal_windows: 2

linkage:
  # splink event-name -> CK record linkage (s08) and resolution (s09).
  # The model's match probabilities fall in discrete classes (one per name level x state level).
  # The threshold sits in the widest gap around the accept/reject boundary, measured on 4.0.0:
  # accepted "exact name, compatible state" 0.537-0.554, rejected "Jaro-Winkler >= 0.88, same state"
  # 0.479-0.496 (two alias sets). 0.50 sat on top of a class before the present-day-state level was
  # added, and 356 pairs flipped with a 0.05 change in one weight. 0.52 changes no current decision.
  min_match_probability: 0.52
  # V27 (WARNING): a class of at least class_min_pairs candidate pairs within threshold_margin of the
  # threshold means a small change in the training data can flip many links.
  threshold_margin: 0.015
  class_min_pairs: 20
  ambiguity_margin: 0.10
  u_sampling_max_pairs: 2000000
  seed: 20260923
  # Fixed m-probability for "state incompatible". EM estimates 0 (no training
  # match has an incompatible state), which would make a mis-filed state an
  # absolute veto. 0.01 = strong evidence against, but a name + footprint
  # match can still win.
  state_mismatch_m_floor: 0.01
  # s09: prior probability that a successor named by an event lies in the predecessor's
  # territorial footprint at all. Inside a footprint of k districts each candidate's prior is
  # footprint_prior / k (instead of s08's map-wide lambda ~ 1/900) and the s08 Bayes factor is
  # re-based on it. Measured on the 4.0.0 build: of the successors (with a linked predecessor)
  # whose name matched, 971 matched inside the footprint and 35 only outside it (0.965). 0.9 is
  # deliberately below that, so footprint evidence never outweighs a poor name.
  footprint_prior: 0.9
  # s09: the same re-basing for a PREDECESSOR with strong name evidence that misses the map-wide
  # threshold: prior state_scope_prior / k over the k districts on the map filed under a state
  # compatible with the event's state. Measured on the 4.0.0 build: 621 of the 625 linked
  # predecessors lie in such a state (0.994); 0.9 again keeps it conservative.
  state_scope_prior: 0.9

map_dates:
  # A state-map is flagged as possibly depicting later boundaries than its
  # label when at least this many of its new districts, and at least this share
  # of those with a recorded creation year, appear before that year. Isolated
  # cases are more likely event-date noise than a mislabelled layer. Flagged
  # layers need a second source before a CONFIRMED row goes into
  # data/reference/vintage_depiction.csv.
  min_districts: 3
  min_share: 0.5

area_check:
  # pyproj geodesic area vs DuckDB ST_Area_Spheroid (independent GeographicLib
  # implementation). Same polygon, same ellipsoid: must agree far tighter.
  max_rel_diff_pct: 0.01

evidence:
  # External evidence (e01-e04, a01). A claim's subject is located by its coordinate on the map
  # of its date; a point outside every polygon is taken to the nearest one within near_km
  # (coastal and border points digitised slightly off the polygon).
  near_km: 10.0
  # Area agreement bands, as used by the external audit since 3.0.0: within area_agree (share)
  # is agreement; up to area_minor is a minor difference (digitisation or an undated figure).
  area_agree: 0.02
  area_minor: 0.10

products:
  # s10 district_reference_context: a source district counts as "drawn on" by a reference district
  # when it supplies at least this share of the target (1%: below it the overlap is edge noise from
  # two editions' lines, the same scale as boundary displacement).
  min_source_share: 0.01
  # Products that are sums of other products must match them to floating-point precision (V26).
  arithmetic_tol_km2: 1.0e-6

release:
  # Release geometry (r01) is simplified polygon by polygon, keeping each valid. 0.0005 degrees
  # (~55 m) is far below the 1 km displacement rule and the accuracy of 1:1,000,000 source maps.
  # Measured: median area change 0.005% (2025) / 0.002% (1951), p99 0.46%, max 6.8% on a 1 km2
  # disputed fragment. Coverage simplification (shared borders kept identical) is not used: the
  # layers' shared borders are digitised independently (183 polygons with mismatched edges in 2025)
  # and it distorted them (Tumakuru -26%). Areas in the release are always the full-resolution ones.
  simplify_deg: 0.0005

harmonize:
  # h05 checks. Conservation: the harmonized national total must equal sum(value x sum of its
  # weights) for every indicator, year and method; the mapped-area self-check must reproduce
  # district_reference_context.mapped_km2. Both are exact up to floating-point summation:
  # measured max difference 7e-12 km2 over 6,678 district-years.
  conservation_rel_tol: 1.0e-9
  self_check_tol_km2: 1.0e-6
  # Bring-your-own harmonization (harmonize/restate.py): for a row whose name matched no identity,
  # list up to max_candidates identities on that map, in compatible states, with name similarity
  # >= min_similarity. Suggestions only; a row is never linked by them. 0.80 is below the identity
  # tie-break (identity.name_jw 0.90) so near misses (Kangraa, Bangalore Rural/Rural Bangalore) show.
  suggest:
    min_similarity: 0.80
    max_candidates: 3
  # Rows per POST /api/harmonize request: every 2025 district for 60 years is ~45,000 rows.
  max_request_rows: 50000
  # Request bodies above this are refused (413) before parsing: 50,000 rows of JSON with long names
  # and states measure ~6 MB; 16 MB leaves room without letting one request exhaust memory.
  max_request_bytes: 16000000
  # h05 method sensitivity: a 2025 district's value under another weight method (CROPLAND) is flagged
  # when it differs from AREA's by more than this share. Flagging only: no value is changed or chosen.
  # NOT YET MEASURED: no cropland raster has been supplied. 0.25 is a starting point (a quarter of the
  # value moving between districts is material for any district statistic); re-measure the
  # distribution of rel_difference on the first raster and set it in the gap above the bulk.
  sensitivity_flag_rel: 0.25

audit:
  # a02 credibility audit: measures from the maps, the events compilation and the internal checks
  # only (no external source). Thresholds below decide what the report lists; every measure is
  # written in full to its CSV.
  # Land that moves A -> B and later B -> A is either a real reversal or two editions drawing one
  # line differently. 100 km2 is ~100x the per-district boundary displacement between same-edition
  # maps (~200 km2 over ~400 districts per window, s03), so smaller returns are left to the CSV.
  return_flow_min_km2: 100
  # A district whose area moves by at least this share between consecutive maps and later returns
  # to within revert_pct of its earlier area (measured: 3 identities at 25% / 5%).
  reversal_jump_pct: 25
  reversal_revert_pct: 5
  # Expert review (outputs/audit/review_sample.csv): a fixed sample of lineage edges and crosswalk
  # rows, drawn by hashing each item's id with the seed, so the same items are drawn on every build
  # and reviews accumulate in data/reference/review_outcomes.csv. 30 of each gives a 95% interval of
  # about +/-15 points on an error rate near 10% (Wilson); enough to tell "rare" from "common".
  # Crosswalk rows smaller than review_min_km2 are edge effects, not weights anyone relies on.
  review_seed: review-2026-10
  review_sample_size: 30
  review_min_km2: 10

determinism:
  # Declared outputs allowed to differ between two builds of the same inputs, each with its
  # reason. Every other output in dvc.yaml must be byte-identical (CI: district_evolution/compare_builds.py).
  nondeterministic_outputs:
    data/gold/district_evolution.duckdb: >-
      pipeline_run.built_at records the build time. The tables inside are loaded from the
      byte-identical parquet outputs and checked by the s11 invariants on every build.
